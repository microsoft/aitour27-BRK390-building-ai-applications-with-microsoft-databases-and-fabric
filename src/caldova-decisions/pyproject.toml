[project]
name = "caldova-campaign-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "mcp>=1.26,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
  "microsoft-teams-apps>=2,<3",
  "azure-cosmos-agent-memory==0.3.0b2",
  "prompty==2.0.0a9", # Toolkit prompt format is incompatible with prompty 2.0.2.
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "pillow>=11,<13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
